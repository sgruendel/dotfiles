[bootstrap.packages]
"aur:ai-usagebar-bin" = "latest"
# replaced by OmaWarden: "aur:bitwarden-bin" = "latest"
# replaced by OmaWarden: "aur:bitwarden-cli-bin" = "latest"
# included since 4.5: "aur:disktree-bin" = "latest"
"aur:gitmux-bin" = "latest"
"aur:mongodb-compass-bin" = "latest"
"aur:omawarden-bin" = "latest"
"aur:rptui-bin" = "latest"
"aur:sinuous" = "latest"
"aur:tabularis-bin" = "latest"
"pacman:7zip" = "latest"
"pacman:git-delta" = "latest"
"pacman:hyphen-de" = "latest"
"pacman:keepassxc" = "latest"
"pacman:lazydocker" = "latest"
"pacman:meld" = "latest"
"pacman:playerctl" = "latest"
"pacman:rclone" = "latest"
"pacman:shellcheck" = "latest"
"pacman:syncthing" = "latest"
"pacman:viu" = "latest"
"pacman:yazi" = "latest"

[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm.git" }
"~/.config/tmux/plugins/catppuccin/tmux" = { url = "https://github.com/catppuccin/tmux.git", ref = "v2.3.0" }

[bootstrap.hooks.pre-dotfiles]
run = [
  'bash "{{ config_root }}/bin/backup-dotfiles"',
  '''
for dev_env in node java go; do
  if [[ ! -d "$HOME/.local/share/mise/installs/$dev_env" ]]; then
    omarchy install dev env "$dev_env"
  fi
done

go_mod_cache="$HOME/.cache/go"
if [[ $(go env GOMODCACHE) != "$go_mod_cache" ]]; then
  go env -w "GOMODCACHE=$go_mod_cache"
fi
''',
  '''
if ! omarchy-pkg-present visual-studio-code-bin; then
  omarchy install editor vscode
fi
''',
]

[dotfiles]
"~/.XCompose" = { source = "X/XCompose", mode = "symlink" }
"~/.ideavimrc" = { source = "ideavim/ideavimrc", mode = "symlink" }
"~/.inputrc" = { source = "bash/inputrc", mode = "symlink" }
"~/.gitmux.conf" = { source = "tmux/gitmux.conf", mode = "symlink" }

"~/.config/git/config" = { source = "git/config", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "herdr/config.toml", mode = "symlink" }
"~/.config/hypr" = { source = "hypr", mode = "symlink-each", exclude = ["*.conf"] }
"~/.config/lazygit/config.yml" = { source = "lazygit/config.yml", mode = "symlink" }
"~/.config/nvim" = { source = "nvim", mode = "symlink-each" }
"~/.config/omarchy/shell.json" = { source = "omarchy/shell.json", mode = "symlink" }
"~/.config/ripgrep/config" = { source = "ripgrep/config", mode = "symlink" }
"~/.config/tmux/tmux.conf" = { source = "tmux/tmux.conf", mode = "symlink" }
"~/.config/voxtype/config.toml" = { source = "voxtype/config.toml", mode = "symlink" }

"~/.config/Code/User/settings.json" = { source = "Code/settings.json", mode = "symlink" }
"~/.config/Code/User/keybindings.json" = { source = "Code/keybindings.json", mode = "symlink" }

[tasks.bootstrap]
description = "Enable Syncthing, authenticate GitHub, and configure Bash and Omarchy plugins"
run = '''
systemctl --user enable syncthing.service
systemctl --user start syncthing.service

if ! gh auth status >/dev/null 2>&1; then
  gh auth login --web --git-protocol https
fi

gh auth setup-git

bashrc="$HOME/.bashrc"
touch "$bashrc"

for line in \
  'export RIPGREP_CONFIG_PATH=~/.config/ripgrep/config' \
  'source ~/Projects/dotfiles/bash/aliases' \
  'source ~/Projects/dotfiles/bash/functions'; do
  if ! grep -Fqx -- "$line" "$bashrc"; then
    printf '%s\n' "$line" >> "$bashrc"
  fi
done

mise use -g jactionlint

# Configure Omarchy plugins
omarchy plugin add https://github.com/akitaonrails/ai-usagebar.git --enable
omarchy plugin add https://github.com/icyleaf/omarchy-bitwarden.git --enable
omarchy plugin add https://github.com/stappmus/Omarchy-Spotify.git --enable
omarchy plugin add https://github.com/sgruendel/omarchy-airq.git --enable
omarchy plugin add https://github.com/sgruendel/omarchy-fzf.git --enable
'''
